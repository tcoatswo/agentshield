[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Fast, deterministic Indirect Prompt Injection (IPI) defense & sanitization engine for LLM agents."
readme = "README.md"
authors = [{ name = "Tyler Coatsworth" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["llm", "security", "prompt-injection", "ai-agents", "cybersecurity", "injecagent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
agent-shield = "agentshield.cli:main"
agentshield = "agentshield.cli:main"

[tool.setuptools.packages.find]
include = ["agentshield*"]
